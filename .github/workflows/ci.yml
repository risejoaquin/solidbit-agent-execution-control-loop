name: SACL CI/CD Control Loop

on:
  push:
    branches: [ main, develop, "sacl-implementation-*", "AC-CONT" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  backend-test:
    name: Backend Pytest & Contract Gate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
