name: SACL - CI (mock only)

on:
  push:
    branches:
      - AC-CONT
  pull_request:
  workflow_dispatch:

# Never give the test runner credentials to mutate the repository or deploy.
permissions:
  contents: read

concurrency:
  group: sacl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout with no persisted write credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q src/sacl tests

      - name: Run governance and regression tests using mock/sandbox services
        run: python -m pytest tests --tb=short -ra

      - name: Parse PowerShell scripts (do not execute them)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          $scripts = @(Get-ChildItem -Path scripts -Filter *.ps1 -File -Recurse)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            foreach ($problem in @($parseErrors)) {
              $failures += "$($script.FullName): $($problem.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell AST PASS ($($scripts.Count) scripts)."
