name: SACL CI — Cross-platform tests and static checks

on:
  push:
    branches:
      - main
      - develop
      - "sacl-implementation-*"
      - "AC-CONT"
      - "sacl/**"
  pull_request:
    branches:
      - main
      - develop
      - "AC-CONT"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests (Python 3.11 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete test suite
        run: |
          python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
          python -m pytest tests/ -q --junitxml=artifacts/pytest-results.xml

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
