name: SACL - CI (mock only)

on:
  push:
    branches:
      - AC-CONT
  pull_request:
  workflow_dispatch:

# Never give the test runner credentials to mutate the repository or deploy.
permissions:
  contents: read

concurrency:
  group: sacl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout with no persisted write credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q src/sacl tests

      - name: Run governance and regression tests using mock/sandbox services
        run: python -m pytest tests --tb=short -ra

      - name: Rehearse the isolated eight-step E2E gates (02-08)
        run: python -m pytest tests/e2e/test_mock_certification.py --junitxml=e2e-rehearsal.xml -q

      - name: Parse PowerShell scripts (do not execute them)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          $scripts = @(Get-ChildItem -Path scripts -Filter *.ps1 -File -Recurse)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            foreach ($problem in @($parseErrors)) {
              $failures += "$($script.FullName): $($problem.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell AST PASS ($($scripts.Count) scripts)."
          Set-Content -Path "e2e-ast-pass.txt" -Value "TEST-01-AST=PASS" -Encoding utf8


      - name: Generate fail-closed mock certification evidence
        if: always()
        run: python scripts/report_e2e_mock.py --junit e2e-rehearsal.xml --runner ${{ runner.os }} --ast-marker e2e-ast-pass.txt --output-dir e2e-evidence

      - name: Upload E2E rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacl-e2e-mock-${{ runner.os }}-${{ github.run_id }}
          path: |
            e2e-evidence/
            e2e-rehearsal.xml
          if-no-files-found: error
          retention-days: 14
