name: SACL - CodeQL security analysis

on:
  push:
    branches:
      - AC-CONT
  pull_request:
  workflow_dispatch:

# CodeQL is a GitHub-hosted static analysis; no runtime or deployment access.
permissions:
  contents: read
  security-events: write

concurrency:
  group: sacl-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-python:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze repository code
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
